name: EAS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/eas-android-apk.yml"

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Essentia 0.3.2 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Build Android APK on EAS
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --wait
