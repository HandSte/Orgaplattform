name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate missing lockfiles
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          if [ ! -f mobile/package-lock.json ]; then
            (cd mobile && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          fi

      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already committed."
          else
            git commit -m "chore: add npm lockfiles"
            git push
          fi

      - name: Install web
        run: npm ci --no-audit --no-fund

      - name: Build web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://btfqvxoaawpgrlstkthn.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

      - name: Install mobile
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck
